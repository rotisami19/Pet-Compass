plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.20'
    id 'net.darkhax.curseforgegradle' version '1.1.25'
}

version = "${mod_version}"
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url "https://maven.neoforged.net/releases/"
    }
    maven {
        // JEI repository
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources { srcDir 'src/generated/resources' }

// JEI version for Minecraft 1.21.1
def jei_version = "19.21.0.247"

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"
    
    // JEI - Just Enough Items (compile only, optional at runtime)
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // Runtime JEI for testing
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        programArguments.add('--nogui')
    }
    
    data {
        programArguments.addAll('--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath())
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// ============================================
// CurseForge Upload Configuration
// ============================================
// To upload: ./gradlew curseforge
// Requires: CURSEFORGE_API_KEY environment variable
// Get your API key from: https://authors.curseforge.com/account/api-tokens
// ============================================

task curseforge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    // Get API key from environment variable (never commit the key!)
    def curseforgeApiToken = System.getenv('CURSEFORGE_API_KEY')
    apiToken = curseforgeApiToken ?: 'missing_api_key'
    
    // Your CurseForge project ID (get it from your project URL)
    // Example: https://www.curseforge.com/minecraft/mc-mods/pet-compass -> Project ID shown in "About Project"
    def projectId = System.getenv('CURSEFORGE_PROJECT_ID') ?: '0'
    doFirst {
        if (!curseforgeApiToken || curseforgeApiToken.trim().isEmpty()) {
            throw new GradleException("Missing CURSEFORGE_API_KEY environment variable")
        }
        if (!projectId || projectId.trim().isEmpty() || projectId == '0') {
            throw new GradleException("Missing CURSEFORGE_PROJECT_ID environment variable")
        }
    }
    
    def mainFile = upload(projectId, jar)
    mainFile.changelog = file('CHANGELOG.md').exists() ? file('CHANGELOG.md').text : "Version ${mod_version}"
    mainFile.changelogType = 'markdown'
    mainFile.releaseType = 'release' // 'alpha', 'beta', or 'release'
    mainFile.addGameVersion '1.21'
    mainFile.addGameVersion '1.21.1'
    mainFile.addModLoader 'NeoForge'
}
